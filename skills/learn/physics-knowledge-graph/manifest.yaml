    purpose: 校验 handoff、managed pages、hash 和授权并应用局部图谱变更
runtime:
  models: []
  envs: []
  requirements:
    - ../_shared/requirements/requirements.txt
load_policy:
  default: read_skill_only
  references: on_branch
  scripts: call_only
  models: never_inline
authorization:
  safe_apply: allowed_after_import_quality_gate
  destructive_apply_requires: --teacher-authorized --allow-destructive
model_profiles:
  default: weak
  supported: [weak, strong]
last_verified: 2026-07-11
