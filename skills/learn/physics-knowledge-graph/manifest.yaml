name: physics-knowledge-graph
category: learn
role: role-d-physics-learning
version: 1.1.0
status: active
locked: true
distribution: portable
package_export: true
description: Role A handoff 驱动的受控图谱更新，支持 strong 多关系复核但不扩权
triggers:
  - 更新高中物理知识关系图谱
  - 知识关系图谱维护
  - 专题枢纽更新
  - import handoff
  - 图谱反向链接
entry_skill: SKILL.md
scripts:
