    path: roles/role-a-import-maintenance.md
    description: 知识内容导入、raw/Wiki/RAG 同步、导入类 skill 维护
  role-b-retrieval-calling:
    path: roles/role-b-retrieval-calling.md
    description: 检索调用、备课、讲义、组卷、输出、安全学生数据分析
  role-c-kb-framework-admin:
    path: roles/role-c-kb-framework-admin.md
    description: 知识库框架、skills 架构、router、入口兼容、多 agent campaign 编排、角色 A/B/D 测试、Git 子技能
  role-d-physics-learning:
    path: roles/role-d-physics-learning.md
    description: weak/strong 分档学生物理辅导、确定性绘图、题库解析、稳定知识点标签和受控知识图谱

