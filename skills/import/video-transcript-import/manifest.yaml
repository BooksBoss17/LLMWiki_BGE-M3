name: video-transcript-import
category: import
role: role-a-import-maintenance
version: 1.6.0
status: active
locked: true
description: B站教学视频导入：下载、转写、抽帧、三层MD、Wiki+RAG
triggers:
  - B站视频导入
  - 视频转写
  - 抽帧
  - faster-whisper
  - VLM
  - 关键帧
entry_skill: SKILL.md
scripts:
  - path: scripts/run_transcribe_with_shared_runtime.bat
    purpose: 使用共享 faster-whisper 环境和权重执行批量转写
  - path: scripts/bilibili_playurl_download.py
    purpose: API/媒体一致选路、CDN Range 测速、DASH 下载合并和完整性门禁
  - path: scripts/probe_bilibili_cdn.py
    purpose: 对已知 BV 的视频/音频 CDN 镜像做安全差分测速
  - path: scripts/normalize_video_queue.py
    purpose: 统一单对象/数组队列并生成跨平台安全存储标题
  - path: scripts/video_path_utils.py
    purpose: 队列与 Windows 存储标题规范化共享函数
  - path: scripts/transcribe_video_batch.py
    purpose: see SKILL.md
  - path: scripts/make_transcript_compact.py
    purpose: see SKILL.md
  - path: scripts/summarize_import_status.py
    purpose: see SKILL.md
  - path: scripts/validate_video_import.py
    purpose: see SKILL.md
  - path: ../../_shared/scripts/import_handoff.py
    purpose: 创建并校验 Role A 到 Role D 的强制 import handoff
  - path: ../../learn/physics-knowledge-graph/scripts/update_graph.py
    purpose: 在最终 RAG 重建前应用或审批受控图谱增量
mcp_servers:
  - name: bilibili-search
    required: false
    catalog: ../../_registry/mcp_servers.catalog.yaml
    purpose: B站候选搜索、UP主遍历与 BV/cid 元数据核验；已知 BV 导入不强制依赖
    tools:
      - mcp_bilibili_search_bilibili_search_summary
      - mcp_bilibili_search_bilibili_video_detail
      - mcp_bilibili_search_bilibili_user_complete
runtime:
  tool_ids:
    - ffmpeg-8.1.1
    - ffprobe-8.1.1
    - node-24.16.0
    - bilibili-mcp-js-0.1.3
  model_ids:
    - faster-whisper-large-v3
    - faster-whisper-medium
  models:
    - name: faster-whisper-large-v3
      path: ../../_shared/model-tools/runtime/models/faster-whisper/faster-whisper-large-v3
      required: true
      status: copied
    - name: faster-whisper-medium
      path: ../../_shared/model-tools/runtime/models/faster-whisper/faster-whisper-medium
      required: false
      status: copied
  envs:
    - name: python310-faster-whisper
      path: ../../_shared/model-tools/runtime/envs/document-stt-py310
      required: true
      status: copied-shared
  requirements:
    - ../../_shared/model-tools/requirements/document-stt-py310.txt
load_policy:
  default: read_skill_only
  references: on_branch
  scripts: never_inline
  models: never_inline
last_verified: 2026-07-10
